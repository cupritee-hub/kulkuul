<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>쿨쿨홈</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; }
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .home-image {
    width: 100%;
    height: 100%;
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
  }
</style>
</head>
<body>
  <img class="home-image" src="./kulkuulhome.png" alt="쿨쿨홈" />
</body>
</html>
